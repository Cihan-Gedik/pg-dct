# AnyDBVer / logcollector Docker lab clusters (Patroni on port 8008)
# Reachable from Mac host via Docker bridge IPs (Docker Desktop).
clusters:
  - id: lc-pg-main
    name: lc-pg-main
    patroni_scope: lc-pg-main
    patroni_seed_url: http://172.18.0.2:8008
    etcd_endpoints:
      - http://172.18.0.2:2379
      - http://172.18.0.3:2379
      - http://172.18.0.4:2379
    poll_interval_sec: 5
    nodes_hint:
      - logcollector-cihangedik-node0
      - logcollector-cihangedik-node1
      - logcollector-cihangedik-node2

  - id: lc-pg-vanilla
    name: lc-pg-vanilla
    patroni_scope: lc-pg-vanilla
    patroni_seed_url: http://172.19.0.2:8008
    etcd_endpoints:
      - http://172.19.0.2:2379
      - http://172.19.0.3:2379
      - http://172.19.0.4:2379
    poll_interval_sec: 5
    nodes_hint:
      - logcollector-dev-cihangedik-node0
      - logcollector-dev-cihangedik-node1
      - logcollector-dev-cihangedik-node2
