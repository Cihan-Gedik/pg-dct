# GitHub Release form defaults (https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes)
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Other
      labels:
        - "*"
